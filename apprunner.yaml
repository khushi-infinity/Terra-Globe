version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
run:
  command: node dist-server/server.js || npm start
  network:
    port: 3000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: AWS_REGION
      value: us-east-1
    - name: TERRA_S3_BUCKET
      value: terra-evidence-storage
    - name: DYNAMODB_REPORTS_TABLE
      value: TerraReports
    - name: DYNAMODB_POSTS_TABLE
      value: TerraPosts
